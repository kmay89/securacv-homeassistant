# Is this HACS mirror still the monorepo's integration?
#
# custom_components/securacv/ here is a byte-for-byte copy of the same
# directory in kmay89/securaCV (plus brand/, which HACS wants), and the root
# conftest.py is the monorepo's too. The monorepo's
# .github/workflows/homeassistant-mirror.yml is what keeps them that way: on
# every main commit touching the carried set it copies the set here, proves
# the copy exact with .github/scripts/check_mirror_sync.py, and opens a PR on
# bot/mirror-sync. This workflow is the BACKSTOP for what that push cannot
# see — a hand edit here, a sync that never ran (no MIRROR_PAT upstream), a
# commit that slipped by while the secret was missing: on every push and PR
# that touches the carried set, and weekly on a schedule, sparse-clone the
# integration from the monorepo and diff. Drift fails the run and prints the
# copy commands; the weekly run additionally raises ONE deduplicated issue
# so a fix that landed upstream cannot sit unmirrored for weeks unnoticed.
name: mirror freshness

on:
  push:
    branches: [main]
    paths:
      - 'custom_components/**'
      - 'conftest.py'
      - '.github/scripts/check_mirror_sync.py'
      - '.github/workflows/mirror-freshness.yml'
  pull_request:
    paths:
      - 'custom_components/**'
      - 'conftest.py'
      - '.github/scripts/check_mirror_sync.py'
      - '.github/workflows/mirror-freshness.yml'
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC, off the :00 stampede
  workflow_dispatch:

permissions:
  contents: read
  # the scheduled run raises a deduplicated issue on drift
  issues: write

concurrency:
  group: mirror-freshness-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compare:
    name: custom_components/securacv matches kmay89/securaCV
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Sparse-clone the monorepo integration directory
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/kmay89/securaCV.git /tmp/securaCV
          git -C /tmp/securaCV sparse-checkout set custom_components/securacv
          echo "upstream: $(git -C /tmp/securaCV rev-parse --short HEAD)"
      - name: Compare
        id: compare
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -uo pipefail
          if python3 .github/scripts/check_mirror_sync.py --source /tmp/securaCV; then
            exit 0
          fi
          # A PR here can legitimately LEAD the monorepo's main: the same
          # change ships as a PR in both repos under the same branch name,
          # and the mirror's PR is opened before the monorepo's has merged.
          # In that case the mirror should match the monorepo's branch of the
          # same name, not main. Try it; pass with a notice if it matches, so
          # the ordering ("merge the monorepo PR first") is visible without
          # making the gate advisory.
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] && [ -n "${HEAD_REF:-}" ]; then
            if git -C /tmp/securaCV fetch --depth 1 origin "refs/heads/${HEAD_REF}" 2>/dev/null \
               && git -C /tmp/securaCV checkout -q FETCH_HEAD; then
              echo "upstream main differs; trying monorepo branch '${HEAD_REF}' ($(git -C /tmp/securaCV rev-parse --short HEAD))"
              if python3 .github/scripts/check_mirror_sync.py --source /tmp/securaCV; then
                echo "::notice::custom_components/securacv matches the monorepo branch '${HEAD_REF}', not main yet — merge the monorepo PR first, then this one."
                exit 0
              fi
            else
              echo "no monorepo branch named '${HEAD_REF}' to compare against"
            fi
          fi
          exit 1
      - name: Raise (or refresh) the drift issue on a scheduled run
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="HACS mirror has drifted from kmay89/securaCV"
          OPEN=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[].number' | head -1)
          RUN="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          BODY_TAIL=$'\n\n'"Raised by \`mirror-freshness.yml\`; this issue is reused while it stays open."
          if [ -n "$OPEN" ]; then
            gh issue comment "$OPEN" --body "Still drifted on $(date -u +%Y-%m-%d) — see the run log for the copy commands: $RUN"
          else
            gh issue create --title "$TITLE" --body "The weekly mirror-freshness check found that \`custom_components/securacv/\` here no longer matches the monorepo's copy. The run log lists every DIFFERENT / MISSING / EXTRA file and the exact \`cp\` commands to resync: ${RUN}${BODY_TAIL}"
          fi
