# Is this HACS mirror still the monorepo's integration?
#
# custom_components/securacv/ here is a byte-for-byte copy of the same
# directory in kmay89/securaCV (brand/ included — Home Assistant 2026.3+
# serves the icon from it), and the root conftest.py is the monorepo's too. The monorepo's
# .github/workflows/homeassistant-mirror.yml is what keeps them that way: on
# every main commit touching the carried set it copies the set here, proves
# the copy exact with .github/scripts/check_mirror_sync.py, and opens a PR on
# bot/mirror-sync. This workflow is the BACKSTOP for what that push cannot
# see — a hand edit here, a sync that never ran (no MIRROR_PAT upstream), a
# commit that slipped by while the secret was missing: on every push and PR
# that touches the carried set, and weekly on a schedule, sparse-clone the
# integration from the monorepo and diff. Drift fails the run and prints the
# copy commands; the weekly run additionally raises ONE deduplicated issue
# so a fix that landed upstream cannot sit unmirrored for weeks unnoticed,
# and the first run on main that passes again closes it, so an open issue is
# drift that no run on main has seen fixed yet.
#
# The same sparse clone carries the monorepo's docs/ and .github/workflows/,
# so a second, separate step checks that every link the HACS store page
# (README.md, mirror-owned) makes into kmay89/securaCV still lands: the file
# exists and the #anchor names a real heading (.github/scripts/lint_readme.py
# --source). A heading renamed upstream fails that step, weekly and on any PR
# that touches the store page or the script. It never raises or closes the
# drift issue: those two steps read the Compare step's outcome alone.
name: mirror freshness

on:
  push:
    branches: [main]
    paths:
      - 'custom_components/**'
      - 'conftest.py'
      - 'README.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '.github/scripts/check_mirror_sync.py'
      - '.github/scripts/lint_readme.py'
      - '.github/workflows/mirror-freshness.yml'
  pull_request:
    paths:
      - 'custom_components/**'
      - 'conftest.py'
      - 'README.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '.github/scripts/check_mirror_sync.py'
      - '.github/scripts/lint_readme.py'
      - '.github/workflows/mirror-freshness.yml'
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC, off the :00 stampede
  workflow_dispatch:

permissions:
  contents: read
  # the scheduled run raises a deduplicated issue on drift, and a passing run
  # on main closes it
  issues: write

# PRs collapse per branch, and a new push supersedes the in-flight run; each
# main commit gets its own group, so a burst of merges can never evict the
# main run queued behind another (.github/CI.md R3). Main is never canceled.
concurrency:
  group: mirror-freshness-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compare:
    name: custom_components/securacv matches kmay89/securaCV
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Sparse-clone the monorepo integration directory and the docs the store page links to
        id: clone
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/kmay89/securaCV.git /tmp/securaCV
          # custom_components/securacv for the drift compare; docs and
          # .github/workflows for the store page's links. A link that reaches
          # past this set fails the link step with "outside the sparse
          # checkout", naming the path to add here.
          git -C /tmp/securaCV sparse-checkout set \
            custom_components/securacv docs .github/workflows
          echo "upstream: $(git -C /tmp/securaCV rev-parse --short HEAD)"
      - name: Compare
        id: compare
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -uo pipefail
          if python3 .github/scripts/check_mirror_sync.py --source /tmp/securaCV; then
            exit 0
          fi
          # A PR here can legitimately LEAD the monorepo's main: the same
          # change ships as a PR in both repos under the same branch name,
          # and the mirror's PR is opened before the monorepo's has merged.
          # In that case the mirror should match the monorepo's branch of the
          # same name, not main. Try it; pass with a notice if it matches, so
          # the ordering ("merge the monorepo PR first") is visible without
          # making the gate advisory.
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] && [ -n "${HEAD_REF:-}" ]; then
            if git -C /tmp/securaCV fetch --depth 1 origin "refs/heads/${HEAD_REF}" 2>/dev/null \
               && git -C /tmp/securaCV checkout -q FETCH_HEAD; then
              echo "upstream main differs; trying monorepo branch '${HEAD_REF}' ($(git -C /tmp/securaCV rev-parse --short HEAD))"
              if python3 .github/scripts/check_mirror_sync.py --source /tmp/securaCV; then
                echo "::notice::custom_components/securacv matches the monorepo branch '${HEAD_REF}', not main yet — merge the monorepo PR first, then this one."
                exit 0
              fi
            else
              echo "no monorepo branch named '${HEAD_REF}' to compare against"
            fi
          fi
          exit 1
      - name: Raise (or refresh) the drift issue on a scheduled run
        # Keyed to the Compare step alone: a broken store-page link (the last
        # step) is not drift and must not raise this issue.
        if: failure() && steps.compare.outcome == 'failure' && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="HACS mirror has drifted from kmay89/securaCV"
          OPEN=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[].number' | head -1)
          RUN="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          BODY_TAIL=$'\n\n'"Raised by \`mirror-freshness.yml\`; this issue is reused while it stays open, and the first passing run on \`main\` closes it."
          if [ -n "$OPEN" ]; then
            gh issue comment "$OPEN" --body "Still drifted on $(date -u +%Y-%m-%d) — see the run log for the copy commands: $RUN"
          else
            gh issue create --title "$TITLE" --body "The weekly mirror-freshness check found that \`custom_components/securacv/\` here no longer matches the monorepo's copy. The run log lists every DIFFERENT / MISSING / EXTRA file and the exact \`cp\` commands to resync: ${RUN}${BODY_TAIL}"
          fi
      - name: Close the drift issue once the mirror matches again
        # The issue is where a human looks, so it must not outlive the drift:
        # #13 stayed open for weeks after a hand resync made the mirror match.
        # Any run on main that passes (the weekly one, a push, a dispatch)
        # proves the mirror equals the monorepo's main, so it closes the issue
        # with a link to itself. A PR run proves nothing about main (it may
        # have matched a monorepo branch instead), so it never closes one.
        # Keyed to the Compare step, not to the job's status: a broken
        # store-page link says nothing about drift, so it must not keep the
        # issue open. (success() || failure() is "unless the run was
        # canceled".)
        if: (success() || failure()) && steps.compare.outcome == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: HACS mirror has drifted from kmay89/securaCV
        run: |
          RUN="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # Same search the raise step uses, narrowed to the exact title.
          if ! OPEN=$(gh issue list --state open --search "\"$TITLE\" in:title" \
                --json number,title --jq '.[] | select(.title == env.TITLE) | .number'); then
            echo "::warning::could not list open issues; if a drift issue is open, close it by hand — the mirror matches."
            exit 0
          fi
          for n in $OPEN; do
            gh issue close "$n" --reason completed \
              --comment "Back in sync on $(date -u +%Y-%m-%d): $RUN" \
              || echo "::warning::could not close #$n — close it by hand; the mirror matches."
          done
      - name: The store page's links into kmay89/securaCV land
        # Its own step, after the drift steps: it runs whether or not the
        # mirror matches (a drifted mirror can still have broken links), and
        # it fails for a link alone (success() || failure(): unless the run
        # was canceled). lint_readme.py --source checks only the links
        # (files, directories, heading and line anchors); the prose checks
        # are validate.yml's.
        id: links
        if: (success() || failure()) && steps.clone.outcome == 'success'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -uo pipefail
          # The Compare step may have left the clone on a monorepo branch.
          git -C /tmp/securaCV checkout -q main
          if python3 .github/scripts/lint_readme.py --source /tmp/securaCV; then
            exit 0
          fi
          # As in Compare: a PR here can lead the monorepo, linking to a doc
          # its same-named monorepo branch adds. Pass with a notice if the
          # links land there, so the merge order stays visible.
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] && [ -n "${HEAD_REF:-}" ]; then
            if git -C /tmp/securaCV fetch --depth 1 origin "refs/heads/${HEAD_REF}" 2>/dev/null \
               && git -C /tmp/securaCV checkout -q FETCH_HEAD; then
              echo "links miss on upstream main; trying monorepo branch '${HEAD_REF}' ($(git -C /tmp/securaCV rev-parse --short HEAD))"
              if python3 .github/scripts/lint_readme.py --source /tmp/securaCV; then
                echo "::notice::the store page's links land on the monorepo branch '${HEAD_REF}', not main yet — merge the monorepo PR first, then this one."
                exit 0
              fi
            else
              echo "no monorepo branch named '${HEAD_REF}' to check the links against"
            fi
          fi
          exit 1
