name: Tests

on:
  push:
    branches: [main]
    paths:
      - 'custom_components/**'
      - 'conftest.py'
      - 'requirements_test.txt'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'custom_components/**'
      - 'conftest.py'
      - 'requirements_test.txt'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR branch supersedes the in-flight run; main is never
# canceled.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    name: pytest (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: pip install -r requirements_test.txt
      # Three tests check the integration against monorepo ground truth
      # (spec/witness_dictionary.json, docs/voice_sentences_en.yaml) that only
      # exists in kmay89/securaCV, where they run in CI. The test files here
      # stay byte-identical to the monorepo copies, so they are deselected
      # rather than edited.
      - run: >
          pytest custom_components/securacv/tests -q
          --deselect custom_components/securacv/tests/test_homekit_projection.py::test_mirror_matches_the_dictionary
          --deselect custom_components/securacv/tests/test_homekit_projection.py::test_hold_window_is_sane
          --deselect custom_components/securacv/tests/test_voice.py::test_sentences_yaml_matches_registered_intents
