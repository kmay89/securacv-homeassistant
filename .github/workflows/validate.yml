name: Validate

# hassfest + HACS validate the integration's structure and metadata. The
# weekly schedule re-runs both against CURRENT upstream rules even when
# nothing was pushed — hassfest and the HACS checks tighten over time, and
# a rule change upstream should surface here, not in a user's install.
on:
  push:
    branches: [main]
    paths:
      - 'custom_components/**'
      - 'hacs.json'
      - 'README.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '.github/scripts/lint_readme.py'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'custom_components/**'
      - 'hacs.json'
      - 'README.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '.github/scripts/lint_readme.py'
      - '.github/workflows/validate.yml'
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR branch supersedes the in-flight run; main is never
# canceled.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prose:
    # README.md is this repository's HACS store page (hacs.json sets
    # render_readme) and is mirror-OWNED — mirror-freshness never compares
    # it against the monorepo, so before this job nothing read its content
    # at all. The lint checks the three mirror-owned prose files (README,
    # AGENTS.md, CLAUDE.md): every relative link resolves, no banned
    # bird-group word (a group of Canaries is a fleet), no overclaims.
    name: Mirror-owned prose (store page + briefs)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: python3 .github/scripts/lint_readme.py

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Same SHA pin as the monorepo's homeassistant-freshness.yml — bump
      # both together.
      - uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb # master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Same SHA pin as the monorepo's homeassistant-freshness.yml — bump
      # both together.
      - uses: hacs/action@d556e736723344f83838d08488c983a15381059a # main
        with:
          category: integration
          # "topics" is repository metadata only an admin can set (GitHub →
          # About → Topics). Remove this ignore once topics are added — the
          # hacs/default submission enforces the check regardless.
          ignore: topics
